# ==============================================================================
# FENIXCMS SaaS — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Multi-Tenant & Custom Domain Ready with TLS/SSL Hardening
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=fenix_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=fenix_auth_limit:10m rate=5r/m;

# Upstream Application Node Cluster
upstream fenixcms_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirection (All Domains & Subdomains)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name .yourdomain.com _;

    # ACME Challenge for Let's Encrypt / Certbot Renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Main Server Block (Core SaaS, Multi-Tenant Wildcards & Custom Domains)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Matches apex domain, all subdomains (*.yourdomain.com), and custom tenant domains
    server_name yourdomain.com *.yourdomain.com _;

    # SSL Certificates (Configure with Certbot Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # SSL Security Protocols & Strong Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Maximum Request Body (File uploads / Media / Plugins)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Next.js Static Assets Caching & Immutable Delivery
    # --------------------------------------------------------------------------
    location /_next/static/ {
        alias /var/www/fenixcms/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        alias /var/www/fenixcms/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # Health Check Endpoint (Bypass Rate Limiting for Monitoring / Load Balancer)
    # --------------------------------------------------------------------------
    location /api/health {
        proxy_pass http://fenixcms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Authentication & Sensitive APIs Rate Limiting
    # --------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=fenix_auth_limit burst=10 nodelay;
        proxy_pass http://fenixcms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Webhooks Endpoints (Stripe & PayPal) — High Reliability
    # --------------------------------------------------------------------------
    location /api/webhooks/ {
        limit_req zone=fenix_api_limit burst=50 nodelay;
        proxy_pass http://fenixcms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # General Application & WebSocket Proxying
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=fenix_api_limit burst=60 nodelay;
        proxy_pass http://fenixcms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
