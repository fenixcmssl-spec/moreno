name: Production Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  production-gate:
    name: Validate Production Readiness & Zero Fallbacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Comprehensive Test Suite
        run: npm test

      - name: Run Production Audit (Fallbacks, Secrets & Env)
        run: npm run audit:production

      - name: Compile & Build Application
        run: npm run build
