name: Production Gate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  production-gate:
    name: Validate Production Readiness & Zero Fallbacks
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/fenixcms_ci?schema=public
      APP_URL: http://localhost:3000
      PAYPAL_MODE: sandbox
      JWT_SECRET: ci_jwt_secret_token_fenixcms_validation_only_32bytes_minimum
      NEXTAUTH_SECRET: ci_nextauth_secret_token_fenixcms_validation_only

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (Strict Lockfile)
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Comprehensive Test Suite
        run: npm test

      - name: Run Production Audit (Fallbacks, Secrets & Env)
        run: npm run audit:production

      - name: Compile & Build Application
        run: npm run build
