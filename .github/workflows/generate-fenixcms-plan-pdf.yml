name: Generate FenixCMS plan PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/PLAN_MAESTRO_MODIFICACIONES_FENIXCMS.pdf"
      - "docs/PLAN_MEJORAS_ADICIONALES_FENIXCMS_V2.pdf"
      - "docs/FENIXCMS_1.pdf"
      - "docs/FENIXCMS_2.pdf"
      - "docs/FENIXCMS_3.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF generator
        run: python -m pip install --quiet reportlab

      - name: Generate PDF from the control document
        run: |
          python <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase.pdfmetrics import stringWidth
          import re
          src = Path("docs/PLAN_MAESTRO_MODIFICACIONES_FENIXCMS.md")
          out = Path("docs/PLAN_MAESTRO_MODIFICACIONES_FENIXCMS.pdf")
          text = src.read_text(encoding="utf-8")
          replacements = {"●":"-","•":"-","→":"->","←":"<-","—":"-","–":"-","“":'"',"”":'"',"’":"'","‘":"'","…":"...","\u00a0":" "}
          for a,b in replacements.items(): text=text.replace(a,b)
          lines=[]
          for line in text.splitlines():
              line=re.sub(r"^#{1,6}\s*","",line)
              line=line.replace("**","").replace("__","").replace(chr(96),"")
              if line.startswith("> "): line=line[2:]
              lines.append(line.rstrip())
          W,H=A4; left,right,top,bottom=42,42,H-44,44; font,size,leading="Helvetica",8.4,11.2
          max_width=W-left-right; state={"y":top,"page":1}; c=canvas.Canvas(str(out),pagesize=A4)
          def footer():
              c.setFont(font,7.2); c.drawCentredString(W/2,20,f"FenixCMS - Plan maestro de modificaciones | Pagina {state['page']}")
          def new_page():
              footer(); c.showPage(); state["page"]+=1; state["y"]=top
          for raw in lines:
              if raw=="": state["y"]-=leading; continue
              words=raw.split(); current=""; prefix=" "*min(len(raw)-len(raw.lstrip(" ")),8)
              for word in words:
                  candidate=(current+" "+word).strip()
                  if stringWidth(prefix+candidate,font,size)<=max_width: current=candidate
                  else:
                      if current:
                          if state["y"]<bottom+18: new_page()
                          c.setFont(font,size); c.drawString(left,state["y"],prefix+current); state["y"]-=leading; prefix=""
                      current=word
              if current:
                  if state["y"]<bottom+18: new_page()
                  c.setFont(font,size); c.drawString(left,state["y"],prefix+current); state["y"]-=leading
          footer(); c.save()
          PY

      - name: Generate PDF from the additional improvements document
        run: |
          python <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase.pdfmetrics import stringWidth
          import re
          src=Path("docs/PLAN_MEJORAS_ADICIONALES_FENIXCMS_V2.md"); out=Path("docs/PLAN_MEJORAS_ADICIONALES_FENIXCMS_V2.pdf")
          text=src.read_text(encoding="utf-8")
          replacements={"●":"-","•":"-","→":"->","←":"<-","—":"-","–":"-","“":'"',"”":'"',"’":"'","‘":"'","…":"...","\u00a0":" "}
          for a,b in replacements.items(): text=text.replace(a,b)
          lines=[]
          for raw in text.splitlines():
              line=re.sub(r"^#{1,6}\s*","",raw).replace("**","").replace("__","").replace(chr(96),"")
              if line.startswith("> "): line=line[2:]
              lines.append(line.rstrip())
          W,H=A4; left,right=44,44; top,bottom=H-50,48; max_width=W-left-right
          state={"y":top,"page":1}; c=canvas.Canvas(str(out),pagesize=A4)
          def footer():
              c.setFont("Helvetica",7); c.drawCentredString(W/2,22,f"FenixCMS - Mejoras adicionales FASES 24-44 | Pagina {state['page']}")
          def new_page():
              footer(); c.showPage(); state["page"]+=1; state["y"]=top
          for t in lines:
              t=t.strip()
              if not t: state["y"]-=6; continue
              if t.startswith("FenixCMS SaaS") or t.startswith("Plan de mejoras adicionales"): font,size,leading="Helvetica-Bold",17,20
              elif t.startswith("FASE "): font,size,leading="Helvetica-Bold",11,15
              elif re.match(r"^\d+(\.\d+)?\.",t): font,size,leading="Helvetica-Bold",10,13
              else: font,size,leading="Helvetica",8.4,11.2
              cur=""
              for word in t.split():
                  cand=(cur+" "+word).strip()
                  if stringWidth(cand,font,size)<=max_width: cur=cand
                  else:
                      if cur:
                          if state["y"]<bottom+leading: new_page()
                          c.setFont(font,size); c.drawString(left,state["y"],cur); state["y"]-=leading
                      cur=word
              if cur:
                  if state["y"]<bottom+leading: new_page()
                  c.setFont(font,size); c.drawString(left,state["y"],cur); state["y"]-=leading
          footer(); c.save()
          PY

