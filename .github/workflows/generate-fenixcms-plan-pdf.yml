              line=re.sub(r"^#{1,6}\s*","",raw).replace("**","").replace("__","").replace(chr(96),"")
              if line.startswith("> "): line=line[2:]
              lines.append(line.rstrip())
          W,H=A4; left,right=44,44; top,bottom=H-46,46; max_width=W-left-right
          state={"y":top,"page":1}; c=canvas.Canvas(str(out),pagesize=A4)
          def footer():
              c.setFont("Helvetica",7); c.drawCentredString(W/2,21,f"FenixCMS - FENIXCMS_2 | Fase 2 - CheckoutSession, PayPal y provisioning seguro | Pagina {state['page']}")
          def new_page():
              footer(); c.showPage(); state["page"]+=1; state["y"]=top
          for t in lines:
              t=t.strip()
              if not t:
                  state["y"]-=6
                  if state["y"]<bottom+20: new_page()
                  continue
              if t.startswith("FENIXCMS_2"): font,size,leading="Helvetica-Bold",18,21
              elif t.startswith("FASE "): font,size,leading="Helvetica-Bold",12,16
              elif re.match(r"^\d+\.",t): font,size,leading="Helvetica-Bold",10.5,13.5
              elif t.startswith("INICIO FASE") or t.startswith("FIN FASE"): font,size,leading="Helvetica-Bold",11,15
              else: font,size,leading="Helvetica",8.4,11.1
              cur=""
              for word in t.split():
                  cand=(cur+" "+word).strip()
                  if stringWidth(cand,font,size)<=max_width: cur=cand
                  else:
                      if cur:
                          if state["y"]<bottom+leading: new_page()
                          c.setFont(font,size); c.drawString(left,state["y"],cur); state["y"]-=leading
                      cur=word
              if cur:
                  if state["y"]<bottom+leading: new_page()
                  c.setFont(font,size); c.drawString(left,state["y"],cur); state["y"]-=leading
          footer(); c.save()
          print(f"Generated {out} ({out.stat().st_size} bytes)")
          PY

