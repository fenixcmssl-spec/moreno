name: Generate FenixCMS plan PDFs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF generator
        run: python -m pip install --quiet reportlab

      - name: Generate PDFs for available FENIXCMS documents
        run: |
          python <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase.pdfmetrics import stringWidth
          import re

          docs = sorted(Path("docs").glob("FENIXCMS_*.md"))
          W, H = A4
          left, right = 44, 44
          top, bottom = H - 46, 46
          max_width = W - left - right

          def normalize(text):
              replacements = {
                  "→":"->","←":"<-","↓":"v","↑":"^",
                  "—":"-","–":"-","“":'"',"”":'"',"’":"'","‘":"'","…":"...",
                  "\u00a0":" ","✓":"[OK]","✔":"[OK]","☐":"[ ]","✅":"[OK]"
              }
              for a,b in replacements.items():
                  text = text.replace(a,b)
              return text

          for src in docs:
              out = src.with_suffix(".pdf")
              text = normalize(src.read_text(encoding="utf-8"))
              lines = []
              for raw in text.splitlines():
                  line = raw.rstrip()
                  lines.append(line)

              state = {"y": top, "page": 1}
              c = canvas.Canvas(str(out), pagesize=A4)

              def footer():
                  c.setFont("Helvetica", 7)
                  c.drawCentredString(
                      W/2, 21,
                      f"FenixCMS - {src.stem} | Pagina {state['page']}"
                  )

              def new_page():
                  footer()
                  c.showPage()
                  state["page"] += 1
                  state["y"] = top

              def draw_wrapped(t, font, size, leading):
                  words = t.split()
                  cur = ""
                  if not words:
                      state["y"] -= 6
                      return
                  for word in words:
                      cand = (cur + " " + word).strip()
                      if stringWidth(cand, font, size) <= max_width:
                          cur = cand
                      else:
                          if cur:
                              if state["y"] < bottom + leading:
                                  new_page()
                              c.setFont(font, size)
                              c.drawString(left, state["y"], cur)
                              state["y"] -= leading
                          cur = word
                  if cur:
                      if state["y"] < bottom + leading:
                          new_page()
                      c.setFont(font, size)
                      c.drawString(left, state["y"], cur)
                      state["y"] -= leading

              for raw in lines:
                  t = raw.strip()
                  if not t:
                      state["y"] -= 6
                      if state["y"] < bottom + 20:
                          new_page()
                      continue

                  if t.startswith("# "):
                      draw_wrapped(t[2:], "Helvetica-Bold", 18, 22)
                  elif t.startswith("## "):
                      draw_wrapped(t[3:], "Helvetica-Bold", 12.5, 16)
                  elif t.startswith("### "):
                      draw_wrapped(t[4:], "Helvetica-Bold", 10.5, 14)
                  elif t.startswith("INICIO FASE") or t.startswith("FIN FASE"):
                      draw_wrapped(t, "Helvetica-Bold", 10.5, 14)
                  elif t.startswith("- ") or re.match(r"^\[\s?[xX]?\]\s", t):
                      draw_wrapped(t, "Helvetica", 8.4, 11.1)
                  else:
                      draw_wrapped(t, "Helvetica", 8.4, 11.1)

              footer()
              c.save()
              print(f"Generated {out} ({out.stat().st_size} bytes)")

          if not docs:
              raise SystemExit("No FENIXCMS_*.md documents found.")
          PY

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes."
            exit 0
          fi
          git commit -m "docs: generar PDFs de los planes FenixCMS"
          git push
