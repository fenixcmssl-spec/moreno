      - name: Commit generated documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN_MAESTRO_MODIFICACIONES_FENIXCMS.pdf docs/PLAN_MEJORAS_ADICIONALES_FENIXCMS_V2.pdf docs/FENIXCMS_1.pdf docs/FENIXCMS_2.md docs/FENIXCMS_2.pdf docs/FENIXCMS_3.md docs/FENIXCMS_3.pdf
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
