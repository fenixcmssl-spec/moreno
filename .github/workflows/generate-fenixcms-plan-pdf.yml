                  if state["y"]<bottom+leading: new_page()
                  c.setFont(font,size); c.drawString(left,state["y"],cur); state["y"]-=leading
          footer(); c.save()
          PY

      - name: Generate FENIXCMS_2 PDF
        if: ${{ hashFiles('docs/FENIXCMS_2.md') != '' }}
        run: |
          python <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase.pdfmetrics import stringWidth
          import re
          src=Path("docs/FENIXCMS_2.md"); out=Path("docs/FENIXCMS_2.pdf")
          text=src.read_text(encoding="utf-8")
